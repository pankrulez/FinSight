# .github/workflows/ci.yml
name: FinSight CI Pipeline

# Trigger this workflow every time code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download your code onto the GitHub server
    - name: Check out repository
      uses: actions/checkout@v4

    # Step 2: Set up the Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # Caches dependencies to make future runs faster

    # Step 3: Install all your project requirements + Pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    # Step 4: Run the automated test suite
    - name: Run Pytest
      run: |
        pytest tests/
      env:
        PYTHONPATH: ${{ github.workspace }}